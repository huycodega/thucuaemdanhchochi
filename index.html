<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./main.css" />

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Riot&family=Rubik+Glitch+Pop&family=Protest+Revolution&family=Pacifico&display=swap"
      rel="stylesheet"
    />

    <title>Woman Day For My Love 🥰</title>
  </head>

  <body>
    <!-- Nhạc nền -->

    <div class="container">
      <!-- Paper Hearts -->
      <img
        class="paperHeart paperHeart1"
        style="--time: 0s"
        src="./img/paperHeart.webp"
        alt=""
      />
      <img
        class="paperHeart paperHeart2"
        style="--time: 1s"
        src="./img/paperHeart.webp"
        alt=""
      />
      <img
        class="paperHeart paperHeart3"
        style="--time: 2.5s"
        src="./img/paperHeart.webp"
        alt=""
      />
      <img
        class="paperHeart paperHeart4"
        style="--time: 4s"
        src="./img/paperHeart.webp"
        alt=""
      />
      <img
        class="paperHeart paperHeart5"
        style="--time: 2s"
        src="./img/paperHeart.webp"
        alt=""
      />
      <img
        class="paperHeart paperHeart6"
        style="--time: 3s"
        src="./img/paperHeart.webp"
        alt=""
      />

      <!-- Title -->
      <div class="boxTitle">
        <p class="firstTitle partTitle">Chào mừng chị dến</p>
        <p class="secondTitle partTitle">với thế giới của em</p>
      </div>

      <!-- Clouds -->
      <div class="boxCloud">
        <div class="cloud"></div>
        <div class="cloud1"></div>
        <div class="cloud2"></div>

        <div class="btnBox">
          <div class="cloudBtn"></div>
          <button class="openBtn">Chạm vào đây đii ngừi đẹp</button>
        </div>
      </div>

      <!-- Valentine Card -->
      <div class="cardValentine">
        <!-- Left Side -->
        <div class="left">
          <!-- Front -->
          <div class="leftFront">
            <div class="boxShadow">
              <div class="boxTitleCard"></div>
            </div>
            <p class="des">
              Hãy chạm vào tấm thiệp để đọc những tâm tư của em dành cho chị nhé
              🫶🏻
            </p>
          </div>

          <!-- Back - Photo Gallery -->
          <div class="leftBack">
            <div class="photoGallery">
              <h3 class="galleryTitle">Our Memories 💕</h3>

              <div class="photosWrapper">
                <!-- Ảnh 1 -->
                <div class="photoCard photo1">
                  <div class="photoInner">
                    <img src="./img/anh1.jpg" alt="Memory 1" loading="lazy" />
                    <div class="photoOverlay">
                      <span class="photoHeart">❤️</span>
                    </div>
                  </div>
                  <p class="photoLabel">My Dear 🥰</p>
                </div>

                <!-- Ảnh 2 - Main Photo -->
                <div class="photoCard photo2 mainPhoto">
                  <div class="photoInner">
                    <img src="./img/anh2.jpg" alt="Memory 2" loading="lazy" />
                    <div class="photoOverlay">
                      <span class="photoHeart">💖</span>
                    </div>
                  </div>
                  <p class="photoLabel">My Everything ❤️</p>
                </div>

                <!-- Ảnh 3 -->
                <div class="photoCard photo3">
                  <div class="photoInner">
                    <img src="./img/anh3.jpg" alt="Memory 3" loading="lazy" />
                    <div class="photoOverlay">
                      <span class="photoHeart">💕</span>
                    </div>
                  </div>
                  <p class="photoLabel">Our Love 💕</p>
                </div>
              </div>

              <div class="galleryFooter">
                <p class="footerText">💑</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Side - Letter -->
        <div class="right">
          <div class="rightContent">
            <p class="letterContent"></p>
          </div>
        </div>
      </div>

      <!-- Music Toggle Button -->
      <button class="musicToggle muted">
        <span class="musicIcon"></span>
      </button>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
